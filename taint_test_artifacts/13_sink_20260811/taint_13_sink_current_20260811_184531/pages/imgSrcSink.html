<!doctype html><meta charset="utf-8"><body><script>
function tainted(value) {
  localStorage.setItem("taint-key", value);
  return localStorage.getItem("taint-key");
}
try {
var s = tainted("https://example.invalid/img-taint.png"); var i = document.createElement("img"); document.body.appendChild(i); i.setAttribute("src", s); document.body.append("done");
} catch (e) {
  document.body.append("ERR:" + e.name + ":" + e.message);
}
</script></body>
