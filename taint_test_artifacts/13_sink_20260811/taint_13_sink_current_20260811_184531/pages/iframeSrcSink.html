<!doctype html><meta charset="utf-8"><body><script>
function tainted(value) {
  localStorage.setItem("taint-key", value);
  return localStorage.getItem("taint-key");
}
try {
var s = tainted("https://example.invalid/iframe-taint"); var f = document.createElement("iframe"); document.body.appendChild(f); f.setAttribute("src", s); document.body.append("done");
} catch (e) {
  document.body.append("ERR:" + e.name + ":" + e.message);
}
</script></body>
